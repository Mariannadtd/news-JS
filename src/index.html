<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="A responsive news application powered by News API" />
        <title>News Portal</title>
        <link
            rel="icon"
            href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E"
        />
    </head>

    <body>
        <header class="site-header">
            <div class="site-header__content">
                <p class="site-header__eyebrow">Stay informed</p>
                <h1>News Portal</h1>
                <p class="site-header__description">
                    Choose a source and explore the latest headlines from around the world.
                </p>
            </div>
        </header>

        <main class="main-content">
            <section aria-labelledby="sources-heading">
                <h2 id="sources-heading" class="visually-hidden">News sources</h2>
                <div class="sources"></div>
            </section>

            <section aria-labelledby="news-heading">
                <h2 id="news-heading" class="visually-hidden">Latest news</h2>
                <div class="news"></div>
            </section>
        </main>

        <footer class="site-footer">
            <a
                class="site-footer__author"
                href="https://github.com/Mariannadtd"
                target="_blank"
                rel="noopener noreferrer"
            >
                Mariannadtd
            </a>

            <span class="site-footer__year">© 2026</span>

            <a
                class="site-footer__course"
                href="https://rs.school/courses/javascript"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="RS School JavaScript course"
            >
                <img src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School" />
            </a>
        </footer>

        <template id="sourceItemTemp">
            <button class="source__item" type="button">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <article class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>

                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>

                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>

                    <p class="news__read-more">
                        <a target="_blank" rel="noopener noreferrer">Read more</a>
                    </p>
                </div>
            </article>
        </template>
    </body>
</html>
